name: AI visibility source audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/run_visibility_audit.py --output visibility-report.json
      - run: python scripts/validate_visibility_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: heliox-ai-visibility-source-audit
          path: visibility-report.json
